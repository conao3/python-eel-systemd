version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/src/eelsystemd/web"
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
